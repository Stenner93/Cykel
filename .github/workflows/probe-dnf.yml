name: 🔎 Probe DNF representation (midlertidig)

# Engangs-diagnose: hvordan repræsenterer Holdet faktisk et DNF (fx
# Pogačars styrt-exit på etape 8) i sit rå action-log/scoring-summary?
# Nødvendig for at rette DNF-udelukkelsen i build_vuelta_web_data.py, der
# ikke fandt noget ved at lede efter ruleId 1080. Kør manuelt, læs
# job-loggen, slet derefter workflowet + probe_dnf.py igen.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe DNF representation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sæt Python op
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installér afhængigheder
        run: pip install -r requirements.txt

      - name: Probe DNF-repræsentation
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/scrape/probe_dnf.py
