name: 🔎 Probe Holdet fee/value data (midlertidig)

# Engangs-diagnose: leder efter en autoritativ Holdet "Værdi"/rank-kilde til
# at erstatte det nuværende gebyr-ESTIMAT i Holdduel. Kør manuelt, læs
# job-loggen, slet derefter workflowet + probe_fee_data.py igen.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe fee data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sæt Python op
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installér afhængigheder
        run: pip install -r requirements.txt

      - name: Probe fee/value data
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/scrape/probe_fee_data.py
